
name: CloverVM iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CloverVM
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space and Xcode
        run: |
          df -h "$RUNNER_TEMP"
          xcodebuild -version
          xcodebuild -list -project CloverVM.xcodeproj

      - name: Prepare clean build directory
        run: |
          rm -rf "$RUNNER_TEMP/CloverVM-DerivedData"
          mkdir -p "$RUNNER_TEMP/CloverVM-DerivedData"
          touch "$RUNNER_TEMP/CloverVM-DerivedData/test.tmp"
          rm "$RUNNER_TEMP/CloverVM-DerivedData/test.tmp"

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project CloverVM.xcodeproj \
            -scheme CloverVM \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CloverVM-DerivedData" \
            -jobs 2 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloverVM-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
